name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: lint and test without knot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check src tests
      - run: uv run black --check src tests
      - run: uv run pylint src tests
      - run: uv run pytest -m "not slow"
      - name: the wheel ships its templates and static files
        run: |
          uv build
          uv venv --python 3.12 /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/python -c "import knotview.panel.app as a, pathlib as p; d = p.Path(a.__file__).parent; assert (d / 'templates' / 'layout.html').is_file() and (d / 'static' / 'panel.css').is_file(); print('packaged')"

  fidelity:
    name: the real knot against the recorded envelopes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: install babashka, bbin and knot
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          sudo bash install
          mkdir -p "$HOME/.local/bin"
          curl -sL https://raw.githubusercontent.com/babashka/bbin/main/bbin -o "$HOME/.local/bin/bbin"
          chmod +x "$HOME/.local/bin/bbin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.babashka/bbin/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.babashka/bbin/bin:$PATH"
          bbin install https://github.com/UniSoma/knot.git --git/tag v0.12.0
          knot --help | head -1
      - name: a git identity, which knot reads as the default assignee
        run: |
          git config --global user.name probe
          git config --global user.email probe@example.invalid
      - run: uv sync --all-groups
      - run: uv run pytest -m slow --no-cov -v
        env:
          KNOT_VERSION: v0.12.0
