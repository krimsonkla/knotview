# Version updates. These run from this file alone and do not depend on the
# repository's Dependabot alerts setting.
version: 2
updates:
  # The actions pinned by sha in the workflows: a sha never floats, so without
  # this nothing here is ever told a newer one exists.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Sit out a newly published version for a week. A release compromised at
    # source looks exactly like a legitimate one on day zero; most are caught
    # and yanked well inside seven days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Sit out a newly published version for a week. A release compromised at
    # source looks exactly like a legitimate one on day zero; most are caught
    # and yanked well inside seven days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
