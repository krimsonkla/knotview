[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knotview"
version = "0.0.0"
description = "A read-only panel over a knot backlog, dynamic over the project's own configuration."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]

# Three dependencies, and the reasoning is the same as the panel this borrows its
# shape from: the pages are rendered by the process that holds the data, so there is
# no second ecosystem here. No bundler, no package manager for the browser, nothing
# in a template that a test cannot reach.
#
# knot itself is not a dependency here. It is a command this invokes, supplied by the
# tickets layer, and reading its JSON rather than its files is what keeps this from
# owning a second copy of a schema it does not define.
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[project.scripts]
knotview = "knotview.entry.console:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    "pylint>=3",
    "black>=24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=knotview --cov-report=term-missing --cov-fail-under=100"
markers = [
    "slow: drives a real knot project on disk; kept in the default run but named so it can be skipped",
]

[tool.coverage.run]
source = ["knotview"]
branch = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "C90", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.pylint.main]
load-plugins = ["pylint.extensions.mccabe"]

[tool.pylint.basic]
# A test's name is its sentence; a docstring restating it is noise rather than
# documentation. Modules and public units still require one.
no-docstring-rgx = "^(test_|_)"

[tool.pylint.design]
max-complexity = 8
# Single-purpose units yield classes with one public method. Demanding two would
# reward merging responsibilities.
min-public-methods = 1

[tool.pylint.format]
max-line-length = 100
