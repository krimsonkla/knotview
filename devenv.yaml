inputs:
  devenv-layers:
    url: git+ssh://git@github.com/krimsonkla/devenv-layers
    inputs:
      nixpkgs:
        follows: nixpkgs
  claude-code-nix:
    url: github:sadjow/claude-code-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nix-derivations:
    # Pinned by commit, as the shared layer requires: the merge of krimsonkla/nix-derivations#16,
    # which brings knot 0.15.0 for documents attached to tickets.
    url: github:krimsonkla/nix-derivations/8de06876473302a748efbf76334b5686d11bbce3
    inputs:
      nixpkgs:
        follows: nixpkgs
  nix-unstable:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
    inputs:
      nixpkgs:
        follows: nixpkgs
allow_unfree: true
nixpkgs:
  permitted_unfree_packages:
    - claude-code
